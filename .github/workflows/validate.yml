# Purpose: .github / workflows / validate module.
#
# Table of contents:
# 1. Workflow or configuration
# End file heading

name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install browser fixture runtime
        run: npx playwright install --with-deps chromium

      - name: Verify source and distribution
        run: npm run verify

      - name: Check reproducible distribution
        run: |
          cp dist/manifest.json "$RUNNER_TEMP/reviewtool-manifest.json"
          npm run build
          cmp "$RUNNER_TEMP/reviewtool-manifest.json" dist/manifest.json
          npm run check:dist

      - name: Validate tag and extract changelog notes
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run release:notes -- "$GITHUB_REF_NAME"

      - name: Upload verified distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ReviewToolLite
          path: dist/
          retention-days: 7
          if-no-files-found: error
